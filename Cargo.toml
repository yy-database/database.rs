[workspace]
resolver = "2"
members = [
    "projects/types/*",
    "projects/formats/*",
    "projects/storage/*",
    "projects/execution/*",
    "projects/planning/*",
    "projects/facades/*",
    "projects/control/*",
    "projects/cluster/*",
    "projects/protocol/*",
    "projects/gateways/*",
    "projects/adapters/*",
    "projects/connectors/*",
    "projects/services/*",
    "projects/tools/*",
    "projects/conformance/*",
]
default-members = [
    "projects/facades/yydb",
    "projects/facades/yyds",
    "projects/facades/iris",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/oovm/database.rs"

[workspace.dependencies]
# Shared language / SQL / template substrate (pinned revs).
vos = { git = "https://github.com/voml/vos-language.git", rev = "387d9fc3c9a556ddb8a433c627a866a2918d0186" }
von = { git = "https://github.com/voml/von-language.git", rev = "ccc58c90c8f94c0be3dfcacb3b0caec98a6ae3e4", features = ["serde"] }
dejavu = { git = "https://github.com/doki-land/dejavu-engine.git", rev = "8aba1a0a61ac9d7f2112123a57faec649cf67427" }
oak-sql = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "f05abe2c9e99365553871ba152e45f82d72c12d7", package = "oak-sql" }
oak-core = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "f05abe2c9e99365553871ba152e45f82d72c12d7", package = "oak-core" }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }

# Types
yydb-types = { path = "projects/types/yydb-types" }
yyds-types = { path = "projects/types/yyds-types" }
iris-types = { path = "projects/types/iris-types" }
iris-ir = { path = "projects/types/iris-ir" }

# Formats — SQLite is embedded (parse foreign format); YYDS owns its own on-disk codecs.
# MySQL / PostgreSQL / Redis / Mongo disguise gateways do not introduce foreign storage formats.
yydb-formats = { path = "projects/formats/yydb-formats" }
sqlite-formats = { path = "projects/formats/sqlite-formats" }
yyds-formats = { path = "projects/formats/yyds-formats" }

# Storage
yydb-storage = { path = "projects/storage/yydb-storage" }
sqlite-storage = { path = "projects/storage/sqlite-storage" }
yyds-kv = { path = "projects/storage/yyds-storage" }

# Execution (runtime kernels — not product facades)
yydb-engine = { path = "projects/execution/yydb-engine" }
yydb-execution = { path = "projects/execution/yydb-execution" }
yydb-udf = { path = "projects/execution/yydb-udf" }
yyds-execution = { path = "projects/execution/yyds-execution" }

# Planning
yydb-query = { path = "projects/planning/yydb-query" }
yyds-query = { path = "projects/planning/yyds-query" }

# Facades (product assembly / re-export only)
yydb = { path = "projects/facades/yydb" }
yyds = { path = "projects/facades/yyds" }
sqlite = { path = "projects/facades/sqlite" }
iris = { path = "projects/facades/iris" }
iris-wasm = { path = "projects/facades/iris-wasm" }
iris-host = { path = "projects/facades/iris-host" }

# Control plane
yyds-catalog = { path = "projects/control/yyds-catalog" }
yyds-control = { path = "projects/control/yyds-control" }

# Cluster
yyds-coordinator = { path = "projects/cluster/yyds-coordinator" }
yyds-exchange = { path = "projects/cluster/yyds-exchange" }
yyds-replication = { path = "projects/cluster/yyds-replication" }

# Protocol (own wire codecs — no third-party mysql/postgres/redis clients)
yydb-protocol = { path = "projects/protocol/yydb-protocol" }
yyds-protocol = { path = "projects/protocol/yyds-protocol" }

# Gateways (dialect service compatibility + wire client/server)
yyds-gateway = { path = "projects/gateways/yyds-gateway" }
yyds-gateway-mysql = { path = "projects/gateways/yyds-gateway-mysql" }
yyds-gateway-pgsql = { path = "projects/gateways/yyds-gateway-pgsql" }
yyds-gateway-redis = { path = "projects/gateways/yyds-gateway-redis" }
yyds-gateway-mongo = { path = "projects/gateways/yyds-gateway-mongo" }

# Adapters
iris-adapter-mysql = { path = "projects/adapters/iris-adapter-mysql" }
iris-adapter-postgres = { path = "projects/adapters/iris-adapter-postgres" }
iris-adapter-sqlite = { path = "projects/adapters/iris-adapter-sqlite" }
iris-adapter-redis = { path = "projects/adapters/iris-adapter-redis" }
iris-adapter-d1 = { path = "projects/adapters/iris-adapter-d1" }

# Connectors
iris-connector-yydb = { path = "projects/connectors/iris-connector-yydb" }
iris-connector-yyds = { path = "projects/connectors/iris-connector-yyds" }

# Services
yydb-client = { path = "projects/services/yydb-client" }
yydb-server = { path = "projects/services/yydb-server" }
yyds-client = { path = "projects/services/yyds-client" }
yyds-server = { path = "projects/services/yyds-server" }

# Tools
yydb-bench = { path = "projects/tools/yydb-benchmark" }
yyds-bench = { path = "projects/tools/yyds-benchmark" }
iris-generator = { path = "projects/tools/iris-generator", default-features = false }

# Conformance
yyds-gateway-conformance = { path = "projects/conformance/gateway-conformance" }
yydb-conformance = { path = "projects/conformance/yydb-conformance" }
iris-conformance = { path = "projects/conformance/iris-conformance" }

# Third party — dialect wire is owned by gateways/*. No rusqlite / official SQLite engine.
blake3 = "1"
sha1 = "0.11.0"
sha2 = "0.10"
base64 = "0.23.1"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
thiserror = "2"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = true
panic = "abort"
