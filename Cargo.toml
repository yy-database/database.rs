[workspace]
resolver = "2"
members = [
    "projects/*",
    "projects/yyds-gateways/yyds-gateway",
    "projects/yyds-gateways/yyds-gateway-redis",
    "projects/yyds-gateways/yyds-gateway-mysql",
    "projects/yyds-gateways/yyds-gateway-pgsql",
    "projects/yyds-gateways/yyds-gateway-mongo",
    "projects/yyds-gateways/yyds-gateway-conformance",
]
default-members = [
    "projects/yydb",
    "projects/yyds-types",
    "projects/iris",
]
exclude = [
    "projects/.DS_Store",
    "projects/yyds-gateways",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/oovm/database.rs"

[workspace.dependencies]
# Shared language / SQL / template substrate (pinned revs).
vos = { git = "https://github.com/voml/vos-language.git", rev = "387d9fc3c9a556ddb8a433c627a866a2918d0186" }
von = { git = "https://github.com/voml/von-language.git", rev = "ccc58c90c8f94c0be3dfcacb3b0caec98a6ae3e4", features = ["serde"] }
dejavu = { git = "https://github.com/doki-land/dejavu-engine.git", rev = "8aba1a0a61ac9d7f2112123a57faec649cf67427" }
oak-sql = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "f05abe2c9e99365553871ba152e45f82d72c12d7", package = "oak-sql" }
oak-core = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "f05abe2c9e99365553871ba152e45f82d72c12d7", package = "oak-core" }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }

# YYDB
yydb-types = { path = "projects/yydb-types" }
yydb-formats = { path = "projects/yydb-formats" }
yydb-execution = { path = "projects/yydb-execution" }
yydb-udf = { path = "projects/yydb-udf" }
yydb-query = { path = "projects/yydb-query" }
yydb-storage = { path = "projects/yydb-storage" }
yydb-engine = { path = "projects/yydb-engine" }
yydb-protocol = { path = "projects/yydb-protocol" }
yydb = { path = "projects/yydb" }
yydb-client = { path = "projects/yydb-client" }
yydb-server = { path = "projects/yydb-server" }
yydb-bench = { path = "projects/yydb-bench" }
sqlite-formats = { path = "projects/sqlite-formats" }
sqlite-storage = { path = "projects/sqlite-storage" }
sqlite = { path = "projects/sqlite" }

# YYDS
yyds-types = { path = "projects/yyds-types" }
yyds-kv = { path = "projects/yyds-kv" }
yyds-catalog = { path = "projects/yyds-catalog" }
yyds-control = { path = "projects/yyds-control" }
yyds-execution = { path = "projects/yyds-execution" }
yyds-gateway = { path = "projects/yyds-gateways/yyds-gateway" }
yyds-gateway-conformance = { path = "projects/yyds-gateways/yyds-gateway-conformance" }

# Iris
iris = { path = "projects/iris" }
iris-types = { path = "projects/iris-types" }
iris-ir = { path = "projects/iris-ir" }
iris-generator = { path = "projects/iris-generator", default-features = false }
iris-wasm = { path = "projects/iris-wasm" }
iris-host = { path = "projects/iris-host" }
iris-connector-yydb = { path = "projects/iris-connector-yydb" }
iris-connector-yyds = { path = "projects/iris-connector-yyds" }
iris-adapter-mysql = { path = "projects/iris-adapter-mysql" }
iris-adapter-postgres = { path = "projects/iris-adapter-postgres" }
iris-adapter-sqlite = { path = "projects/iris-adapter-sqlite" }
iris-adapter-redis = { path = "projects/iris-adapter-redis" }
iris-adapter-d1 = { path = "projects/iris-adapter-d1" }

# Third party
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.11.0"
sha2 = "0.10"
base64 = "0.23.1"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
thiserror = "2"
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
mysql = "25"
redis = "0.27"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = true
panic = "abort"
